[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibcheck"
version = "0.1.0"
description = "Deterministic bibliography verification for scientific papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bibtexparser>=1.4,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.24,<2",
  "rapidfuzz>=3.9,<4",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
bibcheck = "bibcheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bibcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
