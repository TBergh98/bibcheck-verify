[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bibcheck-verify"
dynamic = ["version"]
description = "Deterministic bibliography verification for scientific papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bibtexparser>=1.4,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.24,<2",
  "rapidfuzz>=3.9,<4",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
bibcheck-verify = "bibcheck.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"bibcheck/skill" = [".github/skills/bibcheck-verify/SKILL.md"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
